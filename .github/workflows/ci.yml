name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, vet, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Unit tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  contract:
    name: API contract (OpenAPI lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.64.1 lint api/openapi.yaml

  integration:
    name: Integration (docker compose + e2e)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare log directories
        run: |
          mkdir -p logs/postgres logs/migrate logs/api
          # The Postgres container runs as an unprivileged user that must be able
          # to write its bind-mounted log directory.
          chmod -R 777 logs

      - name: Start stack (postgres, redis, migrate, api)
        run: docker compose -f deploy/docker-compose.yml up -d --build api

      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/ready >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready in time"
          docker compose -f deploy/docker-compose.yml ps
          exit 1

      - name: Install redis-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Run E2E suite
        run: make e2e

      - name: Show compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  docker:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile
          - name: web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - name: Compute image base (lowercase)
        id: vars
        run: echo "image_base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image_base }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
