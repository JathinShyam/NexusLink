services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuslink-postgres
    environment:
      POSTGRES_USER: nexuslink
      POSTGRES_PASSWORD: nexuslink
      POSTGRES_DB: nexuslink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../logs/postgres:/var/log/postgresql
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgres.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
      - -c
      - log_statement=mod
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuslink -d nexuslink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexuslink-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Opt-in Kafka-compatible broker for the click pipeline:
  #   docker compose --profile analytics up -d
  redpanda:
    image: redpandadata/redpanda:v26.2.5
    container_name: nexuslink-redpanda
    profiles: ["analytics"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the click topic once the broker is healthy (idempotent).
  redpanda-init:
    image: redpandadata/redpanda:v26.2.5
    container_name: nexuslink-redpanda-init
    profiles: ["analytics"]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create ${KAFKA_TOPIC:-url_clicks} --brokers redpanda:29092
        --partitions 3 --replicas 1 || echo "topic already exists"
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.24.8-alpine
    container_name: nexuslink-clickhouse
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: nexuslink
      CLICKHOUSE_USER: nexuslink
      CLICKHOUSE_PASSWORD: nexuslink
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Kafka -> ClickHouse batch writer. Same image as the API.
  consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nexuslink-consumer
    profiles: ["analytics"]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      ENV: development
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      LOG_FILE: consumer.log
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-url_clicks}
      KAFKA_GROUP_ID: nexuslink-analytics
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nexuslink
      CLICKHOUSE_USER: nexuslink
      CLICKHOUSE_PASSWORD: nexuslink
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-500}
      CONSUMER_FLUSH_INTERVAL_MS: ${CONSUMER_FLUSH_INTERVAL_MS:-2000}
    command: ["/app/consumer"]
    volumes:
      - ../logs/consumer:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: nexuslink-migrate
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /logs &&
        migrate -path=/migrations
        -database=postgres://nexuslink:nexuslink@postgres:5432/nexuslink?sslmode=disable
        up >> /logs/migrate.log 2>&1
    volumes:
      - ../migrations:/migrations
      - ../logs/migrate:/logs
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nexuslink-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ENV: development
      PORT: 8080
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      LOG_FILE: app.log
      DATABASE_URL: postgres://nexuslink:nexuslink@postgres:5432/nexuslink?sslmode=disable
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:8080
      JWT_SECRET: dev-secret-change-me
      SNOWFLAKE_MACHINE_ID: 1
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      # Analytics is off by default; enable with the "analytics" profile plus:
      #   ANALYTICS_ENABLED=true ANALYTICS_SINK=kafka KAFKA_BROKERS=redpanda:29092
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      ANALYTICS_SINK: ${ANALYTICS_SINK:-log}
      ANALYTICS_BUFFER_SIZE: ${ANALYTICS_BUFFER_SIZE:-1024}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-url_clicks}
    ports:
      - "8080:8080"
    volumes:
      - ../logs/api:/app/logs

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: nexuslink-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redpanda_data:
  clickhouse_data:
