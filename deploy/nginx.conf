server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Security headers. Locations below deliberately use `expires` instead of
    # add_header so these inherited headers are not dropped.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Same-origin API via reverse proxy (no CORS needed in Docker UI)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: this nginx is the edge proxy, so the
        # client cannot spoof the first X-Forwarded-For hop used for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        expires -1;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        expires -1;
    }

    location = /ready {
        proxy_pass http://api:8080/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        expires -1;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Fonts are versioned by filename in this repo. Keep them cacheable.
    location /fonts/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Theme bootstrap is read from localStorage, so it must revalidate.
    location = /theme-init.js {
        expires -1;
    }

    location = /favicon.svg {
        expires 7d;
    }

    location = /og.png {
        expires 7d;
    }

    # SPA fallback. The shell must revalidate so deploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
