name: Feature request
description: Suggest a new capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        NexusLink follows a phased roadmap (`roadmap/`). Please note the phase this
        request maps to, if any.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API/schema changes if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - Phase 3 — Scale core
        - Phase 4 — Analytics pipeline
        - Phase 5 — Observability & hardening
        - Phase 6 — Deployment & showcase
        - Not on the roadmap / unsure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
